spring.application.name=coleta-smart

# ================================================
# PostgreSQL — URL e credenciais vêm do ambiente
# (local: .env + docker-compose; nuvem: Railway)
# ================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================================
# JPA / Hibernate — ddl-auto cria o schema na primeira execução
# ================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway desligado — Hibernate cuida do schema nesta entrega
spring.flyway.enabled=false

# ================================================
# JWT — segredo vem do ambiente
# ================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ================================================
# Server
# ================================================
server.port=${PORT:8080}

# ================================================
# Actuator — expõe só o health para o pipeline e o browser
# ================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
