# Perfil de teste: tudo em memória, sem dependência externa.
# Ativado pelas classes de teste via @ActiveProfiles("test").

spring.datasource.url=jdbc:h2:mem:coletasmart;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

# Chave fixa de teste (256 bits), separada da chave de produção.
jwt.secret=segredo-de-teste-com-no-minimo-256-bits-para-rodar-o-hs256-local
jwt.expiration=3600000
